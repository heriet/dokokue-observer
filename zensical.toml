[project]
site_name = "どこクエ 観察の森"
site_description = "ブラウザゲーム「どこでもクエスト！トリビュート」の攻略情報をほどよく周知するサイト"
docs_dir = "dokokue_observer_doc/content"
site_dir = "docs"
site_url = "https://heriet.github.io/dokokue-observer/"
repo_url = "https://github.com/heriet/dokokue-observer"

nav = [
  { "本サイトについて" = "index.md" },
  { "マジックアイテム" = "magic-item.md" },
  { "天空のフォージ" = "sky-forge.md" },
  { "精錬" = "refining.md" },
  { "ステータス" = "status.md" },
  { "アイテムデータ" = "item-data.md" },
  { "未整理メモ" = "memo.md" },
]

[project.theme]
language = "ja"
features = [
  "navigation.footer",
  "navigation.top",
  "search.highlight",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "ダークモードに切り替え"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "ライトモードに切り替え"

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
